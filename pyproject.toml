[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-md"
version = "0.1.0"
description = "Print a directory tree as Markdown"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tree-md contributors" }]
keywords = ["markdown", "directory", "tree", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tree-md = "tree_md:main"

[tool.setuptools]
py-modules = ["tree_md"]
